
name: Healthcarev2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: healthcare_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthcare_test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HEALTHCARE_TEST_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=healthcare_test;Password=ci_test_password"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Healthcarev2.sln

      - name: Build solution
        run: dotnet build Healthcarev2.sln --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test backend.Tests/Healthcare.Api.Tests.csproj --configuration Release --no-build

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
